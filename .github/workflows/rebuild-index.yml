name: rebuild-schema-index

# 只有 knowledge/ 下的文档变更才触发，避免无关改动浪费 CI
on:
  push:
    branches: [main]
    paths:
      - "knowledge/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1) 检出文档仓库（当前仓库）
      - name: Checkout knowledge repo
        uses: actions/checkout@v4

      # 2) 检出应用仓库（里面有 ingest 脚本）
      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          repository: Chenylan/ChatBI
          ref: main
          path: app

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 缓存 embedding 模型（all-MiniLM-L6-v2，约 90MB），避免每次重新下载
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/chroma
          key: chroma-onnx-${{ runner.os }}

      # 安装应用仓库的依赖（与生产同版本，保证 embedding 一致）
      - name: Install app dependencies
        run: pip install -r app/requirements.txt

      # 3) 用文档仓库的 knowledge/ 重建索引，输出到构建目录
      - name: Rebuild schema index
        run: |
          python app/tools/ingest_chromadb.py \
            --docs-dir "$GITHUB_WORKSPACE/knowledge" \
            --out "$GITHUB_WORKSPACE/chroma_schema_db"

      # 4) 打包索引产物
      - name: Package index
        run: tar czf schema-index.tar.gz -C chroma_schema_db .

      # 5) 上传产物（可手动下载，或供后续部署步骤使用）
      - name: Upload index artifact
        uses: actions/upload-artifact@v4
        with:
          name: schema-index
          path: schema-index.tar.gz
          retention-days: 7

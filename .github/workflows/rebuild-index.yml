name: rebuild-schema-index

# 只有 knowledge/ 下的文档变更才触发，避免无关改动浪费 CI
on:
  push:
    branches: [main]
    paths:
      - "knowledge/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1) 检出文档仓库（当前仓库）
      - name: Checkout knowledge repo
        uses: actions/checkout@v4

      # 2) 检出应用仓库（里面有 ingest 脚本）
      #    注意：ref 必须指向包含 text-embedding-v3 代码的分支。
      #    当前 v3 代码在 testchat；待 testchat 合并进 main 后，把 ref 改回 main。
      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          repository: Chenylan/ChatBI
          ref: testchat
          path: app

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 安装应用仓库的依赖（与生产同版本，保证 embedding 一致）
      - name: Install app dependencies
        run: pip install -r app/requirements.txt

      # 3) 用文档仓库的 knowledge/ 重建索引，输出到构建目录
      #    embedding 用 DashScope text-embedding-v3，需要 OPENAI_API_KEY（在仓库 Settings 里配 secret）。
      #    默认 base_url 已是 DashScope，除非自定义了 endpoint，否则无需 OPENAI_API_BASE_URL。
      - name: Rebuild schema index
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # OPENAI_API_BASE_URL: ${{ secrets.OPENAI_API_BASE_URL }}
        run: |
          python app/tools/ingest_chromadb.py \
            --docs-dir "$GITHUB_WORKSPACE/knowledge" \
            --out "$GITHUB_WORKSPACE/chroma_schema_db"

      # 4) 打包索引产物（先校验产物存在，避免 ingest 失败后 tar 报让人困惑的错）
      - name: Package index
        run: |
          test -d "$GITHUB_WORKSPACE/chroma_schema_db" || {
            echo "::error::chroma_schema_db 未生成，ingest 步骤可能失败，请查看上一步日志"
            exit 1
          }
          tar czf schema-index.tar.gz -C "$GITHUB_WORKSPACE/chroma_schema_db" .

      # 5) 上传产物（可手动下载，或供后续部署步骤使用）
      - name: Upload index artifact
        uses: actions/upload-artifact@v4
        with:
          name: schema-index
          path: schema-index.tar.gz
          retention-days: 7
